
<div class="container">
  <div class="login-form">
    <form (ngSubmit)="register()" class="form">
      <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;700&display=swap" rel="stylesheet">
      <h2>Register</h2>

      <div class="input-box">
        <input [(ngModel)]="formData.username" name="username" placeholder="Username" required>
      </div>

      <div class="input-box">
        <input [(ngModel)]="formData.email" name="address" placeholder="Address" required>
      </div>

      <div class="input-box">
        <input [(ngModel)]="formData.password" name="password" type="password" placeholder="Password" required>
      </div>

      <button type="submit" class="login-btn">Done</button>
